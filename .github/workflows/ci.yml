name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint examples
        run: python3 tests/lint_examples.py
      - name: Check dist is up to date
        run: python3 scripts/build.py --check
